services:
  postgres_auth:
    image: postgres:16
    container_name: postgres_auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres_buslines:
    image: postgres:16
    container_name: postgres_buslines
    environment:
      POSTGRES_DB: buslines_db
      POSTGRES_USER: bus_user
      POSTGRES_PASSWORD: bus_pass
    ports:
      - "5434:5432"
    volumes:
      - pg_buslines_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus_user -d buslines_db"]
      interval: 3s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth_service
    environment:
      JWT_SECRET_KEY: super_secret_key_for_exam
      DATABASE_URL: postgresql+psycopg2://auth_user:auth_pass@postgres_auth:5432/auth_db
    depends_on:
      postgres_auth:
        condition: service_healthy
    ports:
      - "8001:8001"
    restart: on-failure

  buslines_service:
    build:
      context: .
      dockerfile: buslines_service/Dockerfile
    container_name: buslines_service
    environment:
      JWT_SECRET_KEY: super_secret_key_for_exam
      DATABASE_URL: postgresql+psycopg2://bus_user:bus_pass@postgres_buslines:5432/buslines_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres_buslines:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8002:8000"
    restart: on-failure

  kafka_consumer:
    build:
      context: .
      dockerfile: kafka_consumer/Dockerfile
    container_name: kafka_consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg2://bus_user:bus_pass@postgres_buslines:5432/buslines_db
    depends_on:
      kafka:
        condition: service_healthy
      postgres_buslines:
        condition: service_healthy
    restart: on-failure

  schema_registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema_registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema_registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  saga_consumer:
    build:
      context: .
      dockerfile: saga_consumer/Dockerfile
    container_name: saga_consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql+psycopg2://bus_user:bus_pass@postgres_buslines:5432/buslines_db
      SCHEMA_REGISTRY_URL: http://schema_registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      postgres_buslines:
        condition: service_healthy
      schema_registry:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_AUTH_URL: "http://127.0.0.1:8001"
        VITE_BUSLINES_URL: "http://127.0.0.1:8002"
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - auth_service
      - buslines_service

volumes:
  pg_auth_data:
  pg_buslines_data:
